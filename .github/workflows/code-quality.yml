name: Code Quality

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    
    - name: Lint Client
      run: |
        cd client
        npm ci
        npm run lint || true
    
    - name: Lint Server
      run: |
        cd server
        npm ci
        npm run lint || true

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run npm audit (client)
      run: |
        cd client
        npm audit --audit-level=high || true
      
    - name: Run npm audit (server)
      run: |
        cd server
        npm audit --audit-level=high || true